or error. The auditor should maintain professional scepticism and identify fraud risk factors, but the primary responsibility for preventing/detecting fraud rests with management.", "topic": "ISA 240 Fraud"}, {"q": "What is materiality and how is it used in an audit?", "a": "Materiality is a threshold above which misstatements, individually or in aggregate, could reasonably be expected to influence users' economic decisions. It is used to plan audit procedures, evaluate misstatements and assess their impact on the audit opinion.", "topic": "ISA 320 Materiality"}, {"q": "What is 'performance materiality' under ISA 320?", "a": "An amount set below overall materiality to reduce to an appropriately low level the probability that the aggregate of uncorrected and undetected misstatements exceeds materiality. It is typically set at 50-75% of overall materiality.", "topic": "ISA 320"}, {"q": "What are the auditor's responses to significant risks under ISA 330?", "a": "For significant risks, the auditor: must perform substantive procedures specifically designed to respond to the risk; cannot rely solely on controls (unless testing those controls); should consider whether the risk is pervasive (requiring modification to overall audit approach).", "topic": "ISA 330"}, {"q": "What is the auditor's report on a going concern issue — 'material uncertainty'?", "a": "When a material uncertainty about going concern exists and is adequately disclosed in the financial statements, the auditor includes a 'Material Uncertainty Related to Going Concern' section in the audit report (emphasis of matter). The opinion remains unmodified.", "topic": "ISA 570 Going Concern"}, {"q": "What are the four types of modified audit opinion and when are they used?", "a": "(1) Qualified opinion (except for): material but not pervasive misstatement or limitation. (2) Adverse opinion: material AND pervasive misstatement. (3) Disclaimer of opinion: material AND pervasive limitation on scope. These are the three modifications; unmodified is a clean opinion.", "topic": "ISA 705 Audit Opinion"}, {"q": "What is professional scepticism in auditing?", "a": "An attitude that includes a questioning mind and a critical assessment of audit evidence. The auditor does not assume management is honest or dishonest, but maintains alertness to conditions that may indicate possible misstatement due to error or fraud.", "topic": "Professional Scepticism"}, {"q": "What are substantive procedures in an audit?", "a": "Audit procedures designed to detect material misstatements at the assertion level. They include: (1) tests of details — examining specific transactions, account balances, or disclosures; and (2) substantive analytical procedures — evaluating financial information through analysis of plausible relationships.", "topic": "ISA 330 Substantive"}, {"q": "What are tests of controls and when are they performed?", "a": "Tests of controls assess whether controls are operating effectively. They are performed when the auditor relies on controls to reduce substantive testing, or when substantive testing alone cannot provide sufficient appropriate evidence.", "topic": "ISA 330 Controls"}, {"q": "What does ISA 315 require in risk assessment?", "a": "The auditor must perform risk assessment procedures to obtain an understanding of the entity and its environment, including internal control, sufficient to identify and assess risks of material misstatement at the financial statement and assertion levels.", "topic": "ISA 315"}, {"q": "What are the financial statement assertions for classes of transactions?", "a": "Occurrence (transactions occurred and relate to the entity); Completeness (all transactions recorded); Accuracy (amounts correctly recorded); Cut-off (recorded in correct period); Classification (recorded in appropriate accounts).", "topic": "ISA 315 Assertions"}, {"q": "What are the financial statement assertions for account balances?", "a": "Existence (assets/liabilities exist); Rights and obligations (entity has rights to assets and liabilities are obligations); Completeness (all balances included); Valuation and allocation (recognised at appropriate amounts).", "topic": "ISA 315 Assertions"}, {"q": "What is the purpose of ISQMs (International Standards on Quality Management)?", "a": "ISQM 1 requires firms to design, implement and operate a system of quality management for audit engagements. ISQM 2 covers engagement quality reviews. They replaced ISQC 1 to reflect a more proactive, risk-based approach to quality management.", "topic": "ISQM Quality"}, {"q": "What are Key Audit Matters (KAMs) and where are they reported?", "a": "KAMs are those matters that, in the auditor's professional judgement, were of most significance in the audit of the current period financial statements. They are communicated in the audit report for listed entities (ISA 701), explaining why the matter was significant and how it was addressed.", "topic": "ISA 701 KAMs"}, {"q": "What is an emphasis of matter paragraph in an audit report?", "a": "A paragraph added when the auditor wants to draw users' attention to a matter disclosed in the financial statements that is fundamental to their understanding. It does NOT modify the audit opinion. Examples include significant uncertainty about going concern (when adequately disclosed).", "topic": "ISA 706"}, {"q": "What are the auditor's responsibilities when considering the work of an internal auditor?", "a": "Under ISA 610, the external auditor evaluates whether the internal audit function is objective and competent, and whether the work can be used. The external auditor retains sole responsibility for the audit opinion and must not over-rely on internal audit work on high-risk areas.", "topic": "ISA 610"}, {"q": "What does ISA 505 require for external confirmations?", "a": "The auditor controls the confirmation process: selects items for confirmation, sends requests directly to the third party, and receives responses directly. Oral confirmations must be corroborated in writing. Non-responses must be followed up with alternative procedures.", "topic": "ISA 505"}, {"q": "What are the FRC's Ethical Standards regarding auditor independence?", "a": "Auditors must be independent in mind and appearance. Key requirements: no financial interests in clients; restrictions on non-audit services; partner rotation (5-year cycle for key audit partners on PIEs); no contingent fee arrangements; conflicts of interest must be managed.", "topic": "Ethics Independence"}, {"q": "What are the three levels of misstatement handling under ISA 450?", "a": "(1) Clearly trivial — below a threshold set by auditor, no action needed. (2) Not clearly trivial — accumulated on the schedule of unadjusted misstatements and evaluated. (3) Material — auditor requests management to correct; if not, modify the audit report.", "topic": "ISA 450 Misstatements"}], "Ch16: Other Assurance Assignments": [{"q": "What are the five elements of an assurance engagement under the IAASB Framework?", "a": "(1) A three-party relationship (practitioner, responsible party, intended users); (2) An appropriate subject matter; (3) Suitable criteria; (4) Sufficient appropriate evidence; (5) A written assurance report.", "topic": "Assurance Framework"}, {"q": "What is the difference between a reasonable assurance and a limited assurance engagement?", "a": "Reasonable assurance: high (but not absolute) level of assurance; conclusion expressed positively ('in our opinion…'); more extensive procedures. Limited assurance: lower level; conclusion expressed negatively ('nothing has come to our attention…'); fewer procedures, often enquiry and analytical procedures.", "topic": "Assurance Levels"}, {"q": "What is a review engagement and what standard governs it?", "a": "A review engagement provides limited assurance that financial statements are free from material misstatement. It is governed by ISRE 2400 (historical financial statements) or ISRE 2410 (interim financial information by the entity's auditor). Procedures are mainly enquiry and analytical.", "topic": "Review Engagements"}, {"q": "What is a due diligence engagement?", "a": "An investigation of a target business (usually pre-acquisition) to identify risks, verify financial information, and assess the target's value. It provides factual findings rather than an audit opinion, and the report is typically addressed to the acquirer.", "topic": "Due Diligence"}, {"q": "What is a prospectus report and who requires it?", "a": "A report included in a prospectus when a company is seeking to raise capital from the public. Under UK and EU regulations, auditors provide reports on historical financial information and profit forecasts/estimates included in the prospectus.", "topic": "Prospectus"}, {"q": "What are the key differences between an audit and a compilation engagement?", "a": "A compilation (ISRS 4410) involves the accountant using accounting expertise to assist management in presenting financial information. No assurance is provided; the accountant does not verify the information. The output is a compilation report noting no assurance is expressed.", "topic": "ISRS 4410"}, {"q": "What is a sustainability assurance engagement and what standard is emerging?", "a": "An engagement to provide assurance over sustainability (ESG) information reported by an entity. ISSA 5000 is an international standard being developed to provide a framework for sustainability assurance across different reporting frameworks.", "topic": "Sustainability Assurance"}, {"q": "What are the ethical requirements for an assurance practitioner?", "a": "Practitioners must comply with the fundamental ethical principles: integrity; objectivity; professional competence and due care; confidentiality; and professional behaviour. Independence (in mind and appearance) is required for all assurance engagements.", "topic": "Ethics"}], "Ch17: Reporting Financial Performance": [{"q": "What is IFRS 8 Operating Segments and which entities must apply it?", "a": "IFRS 8 requires disclosure of information about operating segments. It applies to entities whose equity or debt instruments are traded on a public market, or who are in the process of issuing such instruments.", "topic": "IFRS 8"}, {"q": "How is an operating segment identified under IFRS 8?", "a": "An operating segment is a component of an entity that: engages in business activities; whose results are regularly reviewed by the chief operating decision maker (CODM); and for which discrete financial information is available.", "topic": "IFRS 8 Segments"}, {"q": "What are the quantitative thresholds for reporting a segment under IFRS 8?", "a": "A segment is reportable if: (1) Revenue ≥ 10% of total revenue; (2) Profit/loss ≥ 10% of total combined profit/loss (larger of profit or loss groups); (3) Assets ≥ 10% of combined assets. Sufficient segments must be reported to cover 75% of total external revenue.", "topic": "IFRS 8 Thresholds"}, {"q": "What is IAS 33's requirement for presenting EPS?", "a": "Entities with publicly traded shares (or seeking to list) must present basic and diluted EPS on the face of the income statement for continuing operations and for total operations. Both must be shown with equal prominence.", "topic": "IAS 33 Presentation"}, {"q": "What are discontinued operations under IFRS 5?", "a": "A discontinued operation is a component of an entity that has been disposed of or classified as held for sale, representing a separate major line of business or geographical area of operations. Results are presented separately in the income statement.", "topic": "IFRS 5"}, {"q": "How are assets classified as 'held for sale' under IFRS 5?", "a": "An asset is held for sale if: its carrying amount will be recovered principally through a sale transaction rather than continued use; it is available for immediate sale in its present condition; and the sale is highly probable (management commits to a plan, active programme to locate a buyer, expected to complete within 12 months).", "topic": "IFRS 5"}, {"q": "How are non-current assets held for sale measured under IFRS 5?", "a": "At the lower of carrying amount and fair value less costs to sell. Depreciation ceases once classified as held for sale. Impairment losses are recognised in P&L; subsequent increases in FV less costs to sell are also recognised in P&L but only up to the cumulative impairment loss.", "topic": "IFRS 5 Measurement"}, {"q": "What information must be disclosed for each reportable segment under IFRS 8?", "a": "Revenue (external and inter-segment); profit or loss; total assets; total liabilities (if reported to CODM); capital expenditure; depreciation; material non-cash items; and the basis of measurement. Reconciliations of segment totals to financial statement totals are required.", "topic": "IFRS 8 Disclosures"}], "Ch18: Financial Statement Analysis": [{"q": "What are the five main categories of financial ratios used in analysis?", "a": "Profitability ratios; Liquidity ratios; Gearing/leverage ratios; Efficiency/activity ratios; and Investor ratios (e.g. EPS, P/E, dividend yield).", "topic": "Ratio Categories"}, {"q": "What is the formula for Return on Capital Employed (ROCE)?", "a": "ROCE = EBIT (Operating profit) ÷ Capital Employed × 100%. Capital employed = Total equity + Non-current liabilities (or equivalently Total assets – Current liabilities).", "topic": "Profitability"}, {"q": "What is the formula for the current ratio and what does it measure?", "a": "Current ratio = Current assets ÷ Current liabilities. It measures short-term liquidity — the ability to meet current obligations with current assets. A ratio above 1 suggests assets exceed liabilities, though the ideal level varies by industry.", "topic": "Liquidity"}, {"q": "What is the quick ratio (acid test) and how does it differ from the current ratio?", "a": "Quick ratio = (Current assets – Inventories) ÷ Current liabilities. It is a more conservative liquidity measure, excluding inventories which may not be quickly convertible to cash.", "topic": "Liquidity"}, {"q": "What is the gearing ratio and what does a high gearing level indicate?", "a": "Gearing = Debt ÷ (Debt + Equity) × 100% (or Debt ÷ Equity). High gearing indicates greater financial risk — the entity has significant interest obligations and must service debt before equity holders. It amplifies both profits and losses for equity holders.", "topic": "Gearing"}, {"q": "What is the interest cover ratio?", "a": "Interest cover = EBIT ÷ Finance costs. It measures the ability to service debt from operating profits. A higher ratio indicates lower risk; a ratio below 2 is generally a concern.", "topic": "Gearing"}, {"q": "What is the inventory days ratio?", "a": "Inventory days = (Inventories ÷ Cost of sales) × 365. It measures the average number of days inventories are held before sale. Rising inventory days may indicate slow-moving stock, obsolescence risk, or improved purchasing.", "topic": "Efficiency"}, {"q": "What are receivable days and payable days?", "a": "Receivable days = (Trade receivables ÷ Revenue) × 365 — the average time to collect from customers. Payable days = (Trade payables ÷ Cost of sales or Purchases) × 365 — the average time taken to pay suppliers. Together with inventory days they form the cash conversion cycle.", "topic": "Efficiency"}, {"q": "What is the Price/Earnings (P/E) ratio and what does it indicate?", "a": "P/E ratio = Market price per share ÷ EPS. It indicates the market's expectation of future growth — a high P/E suggests investors expect strong earnings growth. It allows comparison between companies of different sizes.", "topic": "Investor Ratios"}, {"q": "What is the dividend yield and the dividend cover ratio?", "a": "Dividend yield = Dividend per share ÷ Market price per share × 100%. Dividend cover = EPS ÷ Dividend per share. Cover measures sustainability of dividends; yield measures the cash return to investors relative to share price.", "topic": "Investor Ratios"}, {"q": "What are the limitations of ratio analysis?", "a": "Ratios are based on historical data; different accounting policies make comparisons unreliable; ratios do not capture qualitative factors; window dressing can distort reported figures; ratios must be interpreted in context of industry, business cycle and strategy.", "topic": "Ratio Limitations"}, {"q": "What is the DuPont decomposition of ROCE?", "a": "ROCE = Net profit margin × Asset turnover. Net profit margin = EBIT ÷ Revenue; Asset turnover = Revenue ÷ Capital employed. This shows whether ROCE is driven by margins or asset efficiency.", "topic": "DuPont Analysis"}, {"q": "What is 'creative accounting' and what are common techniques?", "a": "Creative accounting refers to using accounting flexibility to present financial results in a misleading (but technically legal) way. Techniques include: off-balance sheet financing; aggressive revenue recognition; inappropriate capitalisation of expenses; big bath provisioning; related party transactions.", "topic": "Creative Accounting"}, {"q": "What is the cash conversion cycle?", "a": "Cash conversion cycle = Inventory days + Receivable days – Payable days. It measures the time between paying for inventory and receiving cash from customers. A shorter cycle is generally better for cash flow.", "topic": "Efficiency"}, {"q": "What are Z-scores (Altman) used for in financial analysis?", "a": "Altman's Z-score is a distress prediction model combining multiple financial ratios into a single score. A score above a threshold indicates financial health; below indicates distress risk. It is used to predict the probability of corporate failure.", "topic": "Distress Prediction"}]};
const DECK_KEYS = Object.keys(DECKS);
const TOTAL = Object.values(DECKS).reduce((a,b)=>a+b.length,0);

let session = {
  deckKey:'', cards:[], index:0, flipped:false,
  got:0, work:0, shuffle:false, done:false
};

// touch/swipe
let touchX0=0, touchY0=0;

// ── TABS ──
function switchTab(t) {
  ['study','browse'].forEach(id => {
    document.getElementById(id+'-view').classList.toggle('active', id===t);
    document.getElementById('bnav-'+id).classList.toggle('active', id===t);
  });
  if(t==='browse') buildBrowseTopics();
}

// ── DECK SHEET ──
function openSheet() {
  buildSheetList();
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  // Don't auto-focus on iOS — keyboard resize breaks layout
  if(!/iPhone|iPad|iPod/i.test(navigator.userAgent)){
    document.getElementById('sheet-search').focus();
  }
}
function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet-search').value='';
}
function buildSheetList(q) {
  q=(q||'').toLowerCase();
  const list = document.getElementById('sheet-list');
  let html = `<div class="sheet-item ${session.deckKey==='__all__'?'active':''}" onclick="pickDeck('__all__')">
    <span class="si-name" style="font-weight:600">All Topics</span>
    <span class="si-count">${TOTAL}</span>
  </div><div class="sheet-divider"></div>`;
  DECK_KEYS.forEach(key=>{
    if(q && !key.toLowerCase().includes(q)) return;
    const label=key.replace(/Ch\d+:\s*/,'');
    html+=`<div class="sheet-item ${session.deckKey===key?'active':''}" onclick="pickDeck('${key.replace(/'/g,"\\'")}')">
      <span class="si-name">${label}</span>
      <span class="si-count">${DECKS[key].length}</span>
    </div>`;
  });
  list.innerHTML=html;
}
function filterSheet() {
  buildSheetList(document.getElementById('sheet-search').value);
}
function pickDeck(key) {
  closeSheet();
  session.deckKey=key;
  let cards;
  if(key==='__all__') { cards=[]; Object.values(DECKS).forEach(d=>cards=cards.concat(d)); }
  else cards=[...DECKS[key]||[]];
  session.cards=session.shuffle?shuffle(cards):cards;
  session.index=0; session.got=0; session.work=0;
  session.flipped=false; session.done=false;
  const label=key==='__all__'?'All Topics':key.replace(/Ch\d+:\s*/,'');
  const bar=document.getElementById('deck-pick-bar');
  const lbl=document.getElementById('deck-pick-label');
  lbl.textContent=label;
  lbl.classList.add('chosen');
  renderStudy();
}

// ── RENDER STUDY ──
function renderStudy() {
  const main=document.getElementById('study-main');
  const cards=session.cards;
  document.getElementById('hdr-counter').textContent=
    cards.length ? (session.done ? cards.length : session.index+1)+' / '+cards.length : '';

  if(!cards.length){
    main.innerHTML=`<div class="card-empty"><div class="empty-icon">📭</div><div>No cards</div></div>`;
    return;
  }
  if(session.done){
    const pct=Math.round((session.got/(session.got+session.work||1))*100);
    main.innerHTML=`<div class="session-done">
      <h2>Session Complete</h2>
      <div class="score-ring">
        <div class="score-pct">${pct}%</div>
        <div class="score-lbl">Got it</div>
      </div>
      <p>Reviewed ${cards.length} cards<br>${session.got} got it · ${session.work} needs work</p>
      <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-ghost" onclick="restartDeck()">↺ Restart</button>
        <button class="btn btn-accent" onclick="pickDeck(session.deckKey)">New Session</button>
      </div>
    </div>`;
    return;
  }

  const card=cards[session.index];
  const pct=Math.round((session.index/cards.length)*100);

  main.innerHTML=`
    <div class="opts-row">
      <button class="toggle-btn ${session.shuffle?'on':''}" id="shuf-btn" onclick="toggleShuffle()">⇌ Shuffle</button>
    </div>
    <div class="prog-row">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-lbl">${session.index+1} / ${cards.length}</div>
    </div>
    <div class="card-stage" id="card-stage">
      <div class="card-inner ${session.flipped?'flipped':''}" id="card-inner">
        <div class="card-face card-front" onclick="flipCard()">
          <div class="card-tag">Question</div>
          <div class="card-q">${esc(card.q)}</div>
          <div class="card-topic-pip">${esc(card.topic||'')}</div>
          <div class="card-hint">tap to flip</div>
        </div>
        <div class="card-face card-back" onclick="flipCard()">
          <div class="card-tag">Answer</div>
          <div class="card-a">${esc(card.a)}</div>
          <div class="card-topic-pip">${esc(card.topic||'')}</div>
          <div class="swipe-arrows">← needs work &nbsp;·&nbsp; got it →</div>
        </div>
      </div>
    </div>
    <div class="ctrl-row" id="ctrl-pre" style="${session.flipped?'display:none':''}">
      <button class="btn btn-ghost btn-sm" onclick="prevCard()" ${session.index===0?'disabled':''}>← Prev</button>
      <button class="btn btn-flip" onclick="flipCard()">Reveal Answer</button>
      <button class="btn btn-ghost btn-sm" onclick="skipCard()">Skip →</button>
    </div>
    <div class="ctrl-row" id="ctrl-post" style="${session.flipped?'':'display:none'}">
      <button class="btn btn-no" onclick="markCard(false)">✗ Needs Work</button>
      <button class="btn btn-ok" onclick="markCard(true)">✓ Got It</button>
    </div>
    <div class="stats-chips">
      <div class="chip"><div class="dot dot-g"></div>${session.got} got it</div>
      <div class="chip"><div class="dot dot-r"></div>${session.work} needs work</div>
      <div class="chip"><div class="dot dot-m"></div>${cards.length-session.index-1} left</div>
    </div>`;

  attachSwipe();
}

function flipCard(){
  if(session.done||!session.cards.length) return;
  session.flipped=!session.flipped;
  const ci=document.getElementById('card-inner');
  if(ci) ci.classList.toggle('flipped',session.flipped);
  const pre=document.getElementById('ctrl-pre');
  const post=document.getElementById('ctrl-post');
  if(pre) pre.style.display=session.flipped?'none':'';
  if(post) post.style.display=session.flipped?'':'none';
}
function markCard(got){if(got)session.got++;else session.work++;advanceCard();}
function skipCard(){advanceCard();}
function prevCard(){if(session.index>0){session.index--;session.flipped=false;renderStudy();}}
function advanceCard(){
  if(session.index<session.cards.length-1){session.index++;session.flipped=false;renderStudy();}
  else{session.done=true;renderStudy();}
}
function restartDeck(){
  session.index=0;session.got=0;session.work=0;session.flipped=false;session.done=false;
  if(session.shuffle) session.cards=shuffle([...session.cards]);
  renderStudy();
}
function toggleShuffle(){
  session.shuffle=!session.shuffle;
  const b=document.getElementById('shuf-btn');
  if(b)b.classList.toggle('on',session.shuffle);
  if(session.deckKey) pickDeck(session.deckKey);
}

// ── SWIPE ──
function attachSwipe(){
  const stage=document.getElementById('card-stage');
  if(!stage) return;
  stage.addEventListener('touchstart',e=>{
    touchX0=e.touches[0].clientX; touchY0=e.touches[0].clientY;
  },{passive:true});
  stage.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchX0;
    const dy=e.changedTouches[0].clientY-touchY0;
    if(Math.abs(dx)<Math.abs(dy)||Math.abs(dx)<40) return;
    if(!session.flipped){flipCard();return;}
    if(dx>0) markCard(true); else markCard(false);
  },{passive:true});
}

// ── BROWSE ──
function buildBrowseTopics(){
  const bar=document.getElementById('browse-topic-bar');
  let html='';
  DECK_KEYS.forEach(key=>{
    const label=key.replace(/Ch\d+:\s*/,'');
    html+=`<div class="topic-chip" onclick="browseSelect(this,'${key.replace(/'/g,"\\'")}')"> ${label}</div>`;
  });
  bar.innerHTML=html;
}
function browseSelect(el,key){
  document.querySelectorAll('.topic-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const cards=DECKS[key]||[];
  const label=key.replace(/Ch\d+:\s*/,'');
  let html=`<div class="browse-hdr"><h2>${esc(label)}</h2><p>${cards.length} cards</p></div><div class="card-list">`;
  cards.forEach((c,i)=>{
    html+=`<div class="card-row">
      <div class="cr-num">${i+1}</div>
      <div class="cr-body">
        <div class="cr-q">${esc(c.q)}</div>
        <div class="cr-a">${esc(c.a)}</div>
        <div class="cr-tag">${esc(c.topic||'')}</div>
      </div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('browse-content').innerHTML=html;
  document.getElementById('browse-content').scrollTop=0;
}

// ── UTILS ──
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── KEYBOARD (desktop) ──
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(document.getElementById('study-view').classList.contains('active')){
    if(e.key===' '||e.key==='f'){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight'||e.key==='n') session.flipped?markCard(true):skipCard();
    else if(e.key==='ArrowLeft') session.flipped?markCard(false):prevCard();
    else if(e.key==='g'&&session.flipped) markCard(true);
    else if(e.key==='x'&&session.flipped) markCard(false);
  }
});

// sheet swipe down to close
let shY0=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{shY0=e.touches[0].clientY;},{passive:true});
document.getElementById('sheet').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientY-shY0>60) closeSheet();
},{passive:true});
</script>
</body>
</html>
