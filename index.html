<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CR Flashcards — ICAEW 2025</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0e13;
  --surface: #12151c;
  --surface2: #181c26;
  --surface3: #1e2330;
  --border: #242938;
  --border2: #2e3548;
  --accent: #c8a96e;
  --accent-dim: rgba(200,169,110,0.15);
  --accent2: #7eb8c9;
  --text: #e4e1d8;
  --text2: #a8a49c;
  --muted: #5a6272;
  --success: #5dbb8a;
  --danger: #d95f5f;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;height:-webkit-fill-available;background:var(--bg)}
body{height:100%;height:-webkit-fill-available;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-top);position:fixed;width:100%;top:0;left:0}

/* ─── HEADER ─── */
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);z-index:20}
.logo{font-family:'Playfair Display',serif;font-size:1rem;color:var(--accent)}
.logo em{color:var(--text);font-style:normal;font-weight:400}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-counter{font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);letter-spacing:0.08em}
.hdr-badge{background:var(--accent-dim);border:1px solid rgba(200,169,110,0.2);color:var(--accent);padding:3px 9px;border-radius:20px;font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.06em;white-space:nowrap}

/* ─── BOTTOM NAV ─── */
.bottom-nav{flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-bot);z-index:20}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;color:var(--muted);font-size:0.62rem;font-family:'DM Mono',monospace;letter-spacing:0.06em;text-transform:uppercase;transition:color 0.2s;gap:4px;user-select:none}
.bnav-item.active{color:var(--accent)}
.bnav-icon{font-size:1.25rem;line-height:1}

/* ─── VIEWS ─── */
.view{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0}
.view.active{display:flex}

/* ══════════ STUDY VIEW ══════════ */
#study-view{position:relative}

/* Deck picker button (mobile top bar) */
.deck-pick-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.deck-pick-label{font-size:0.78rem;font-weight:500;color:var(--text2)}
.deck-pick-label.chosen{color:var(--text)}
.deck-pick-arrow{font-size:0.7rem;color:var(--muted);margin-left:8px}

/* Main study area */
.study-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px 16px 8px;overflow:hidden;min-height:0}

/* Progress */
.prog-row{width:100%;max-width:560px;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s ease}
.prog-lbl{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);white-space:nowrap;min-width:48px;text-align:right}

/* Card */
.card-stage{perspective:1200px;-webkit-perspective:1200px;width:100%;max-width:560px;flex-shrink:0;cursor:pointer;user-select:none}
.card-inner{position:relative;width:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.35,0,0.2,1);-webkit-transition:-webkit-transform 0.5s cubic-bezier(0.35,0,0.2,1)}
.card-inner.flipped{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px 28px 48px;text-align:center;min-height:220px;position:relative;overflow:hidden}
.card-front{background:var(--surface2)}
.card-front::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(200,169,110,0.07) 0%,transparent 60%);pointer-events:none}
.card-back{background:#111520;transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card-back::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(126,184,201,0.08) 0%,transparent 60%);pointer-events:none}
.card-tag{font-family:'DM Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--accent);margin-bottom:12px;opacity:0.75}
.card-back .card-tag{color:var(--accent2)}
.card-q{font-family:'Playfair Display',serif;font-size:clamp(0.95rem,2.8vw,1.15rem);line-height:1.55;color:var(--text);overflow-y:auto;max-height:150px}
.card-a{font-family:'DM Sans',sans-serif;font-size:clamp(0.8rem,2.5vw,0.88rem);line-height:1.7;color:var(--text2);font-weight:300;overflow-y:auto;max-height:160px;text-align:left}
.card-topic-pip{position:absolute;bottom:12px;right:14px;background:var(--surface3);border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace;font-size:0.57rem;letter-spacing:0.05em}
.card-hint{position:absolute;bottom:12px;left:14px;font-family:'DM Mono',monospace;font-size:0.57rem;color:var(--muted);opacity:0.5;letter-spacing:0.04em}
/* swipe indicator arrows */
.swipe-arrows{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:0.57rem;color:var(--muted);opacity:0.4;letter-spacing:0.03em;white-space:nowrap}

.card-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--muted);font-size:0.85rem}
.empty-icon{font-size:2rem;opacity:0.25}

/* Controls */
.ctrl-row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.84rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all 0.15s;letter-spacing:0.01em;min-height:44px;user-select:none}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-ghost:active:not(:disabled){background:var(--surface2)}
.btn-ok{background:rgba(93,187,138,0.1);border-color:rgba(93,187,138,0.3);color:var(--success);font-size:0.88rem}
.btn-ok:active{background:rgba(93,187,138,0.2)}
.btn-no{background:rgba(217,95,95,0.09);border-color:rgba(217,95,95,0.25);color:var(--danger);font-size:0.88rem}
.btn-no:active{background:rgba(217,95,95,0.17)}
.btn-flip{background:var(--accent-dim);border-color:rgba(200,169,110,0.3);color:var(--accent);flex:1;max-width:200px}
.btn-flip:active{background:rgba(200,169,110,0.22)}
.btn-accent{background:var(--accent);color:#0c0e13;font-weight:600;border-color:var(--accent)}
.btn-sm{padding:8px 14px;font-size:0.76rem;min-height:36px}

/* Stats chips */
.stats-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:5px;padding:5px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-g{background:var(--success)}.dot-r{background:var(--danger)}.dot-m{background:var(--muted)}

/* Options row */
.opts-row{display:flex;gap:8px;justify-content:center}
.toggle-btn{padding:5px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.07em;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all 0.15s;text-transform:uppercase;min-height:32px}
.toggle-btn.on{border-color:rgba(200,169,110,0.35);background:var(--accent-dim);color:var(--accent)}

/* Session complete */
.session-done{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 20px;text-align:center;max-width:360px;margin:auto}
.session-done h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--accent)}
.session-done p{color:var(--text2);font-size:0.85rem;line-height:1.6}
.score-ring{width:96px;height:96px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:4px 0}
.score-pct{font-family:'DM Mono',monospace;font-size:1.4rem;color:var(--accent);font-weight:500}
.score-lbl{font-family:'DM Mono',monospace;font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em}

/* ── BOTTOM SHEET (deck picker) ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;pointer-events:none;transition:background 0.25s}
.sheet-overlay.open{background:rgba(0,0,0,0.55);pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--border);z-index:51;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);max-height:75vh;display:flex;flex-direction:column;padding-bottom:var(--safe-bot)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;flex-shrink:0}
.sheet-title{font-family:'DM Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);padding:12px 20px 8px;flex-shrink:0}
.sheet-search{margin:0 16px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:16px;font-family:'DM Sans',sans-serif;outline:none;width:calc(100% - 32px)}
.sheet-search:focus{border-color:var(--accent)}
.sheet-search::placeholder{color:var(--muted)}
.sheet-list{overflow-y:auto;flex:1;padding:0 8px 12px}
.sheet-item{padding:12px 14px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;min-height:44px}
.sheet-item:active{background:var(--surface3)}
.sheet-item.active{background:var(--accent-dim)}
.sheet-item.active .si-name{color:var(--accent)}
.si-name{font-size:0.82rem;font-weight:500;color:var(--text2)}
.si-count{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted)}
.sheet-divider{height:1px;background:var(--border);margin:6px 6px 8px}

/* ══════════ BROWSE VIEW ══════════ */
#browse-view{flex-direction:column}
.browse-topic-bar{flex-shrink:0;overflow-x:auto;white-space:nowrap;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:6px;scrollbar-width:none}
.browse-topic-bar::-webkit-scrollbar{display:none}
.topic-chip{display:inline-flex;padding:6px 13px;border-radius:20px;font-size:0.75rem;font-weight:500;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.15s;min-height:34px;align-items:center}
.topic-chip:active{background:var(--surface3)}
.topic-chip.active{background:var(--accent-dim);border-color:rgba(200,169,110,0.3);color:var(--accent)}
.browse-content{flex:1;overflow-y:auto;padding:16px}
.browse-hdr{margin-bottom:16px}
.browse-hdr h2{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:2px}
.browse-hdr p{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);letter-spacing:0.06em}
.card-list{display:flex;flex-direction:column;gap:10px}
.card-row{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:12px}
.cr-num{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);min-width:20px;padding-top:2px}
.cr-body{flex:1}
.cr-q{font-size:0.85rem;font-weight:500;color:var(--text);margin-bottom:6px;line-height:1.45}
.cr-a{font-size:0.78rem;color:var(--text2);line-height:1.6}
.cr-tag{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--accent);margin-top:6px;letter-spacing:0.05em}

/* Scrollbars */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="logo">CR <em>Flashcards</em></div>
  <div class="hdr-right">
    <div class="hdr-counter" id="hdr-counter"></div>
    <div class="hdr-badge">229 Cards · 18 Topics</div>
  </div>
</header>

<!-- ══ STUDY VIEW ══ -->
<div id="study-view" class="view active">
  <div class="deck-pick-bar" onclick="openSheet()" id="deck-pick-bar">
    <span class="deck-pick-label" id="deck-pick-label">Tap to choose a deck →</span>
    <span class="deck-pick-arrow">▾</span>
  </div>
  <div class="study-main" id="study-main">
    <div class="card-empty">
      <div class="empty-icon">📖</div>
      <div>Choose a deck above to begin</div>
    </div>
  </div>
</div>

<!-- ══ BROWSE VIEW ══ -->
<div id="browse-view" class="view">
  <div class="browse-topic-bar" id="browse-topic-bar"></div>
  <div class="browse-content" id="browse-content">
    <div class="card-empty" style="height:100%;justify-content:center">
      <div class="empty-icon">🗂</div>
      <div>Select a topic above</div>
    </div>
  </div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<div class="bottom-nav">
  <div class="bnav-item active" onclick="switchTab('study')" id="bnav-study">
    <div class="bnav-icon">📖</div>
    <div>Study</div>
  </div>
  <div class="bnav-item" onclick="switchTab('browse')" id="bnav-browse">
    <div class="bnav-icon">🗂</div>
    <div>Browse</div>
  </div>
</div>

<!-- ══ BOTTOM SHEET ══ -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Choose a Deck</div>
  <input class="sheet-search" id="sheet-search" placeholder="Search topics…" oninput="filterSheet()" autocomplete="off">
  <div class="sheet-list" id="sheet-list"></div>
</div>

<script>
const DECKS = {"Ch1: Introduction to Corporate Reporting": [{"q": "What are the five components of a complete set of IFRS financial statements per IAS 1?", "a": "Statement of financial position; Statement of profit or loss and other comprehensive income; Statement of changes in equity; Statement of cash flows; and Notes to the financial statements.", "topic": "IAS 1"}, {"q": "What are the two fundamental qualitative characteristics of useful financial information in the Conceptual Framework?", "a": "Relevance and Faithful representation. Relevant information is capable of making a difference in user decisions; faithful representation means the information is complete, neutral and free from error.", "topic": "Conceptual Framework"}, {"q": "What are the four enhancing qualitative characteristics in the Conceptual Framework?", "a": "Comparability, Verifiability, Timeliness, and Understandability. These enhance the usefulness of information that is already relevant and faithfully represented.", "topic": "Conceptual Framework"}, {"q": "Which UK companies must prepare group accounts under IFRS Standards?", "a": "All UK companies whose securities are traded on a regulated public market must prepare group accounts under IFRS Standards.", "topic": "Financial Reporting"}, {"q": "What are the three criteria for a company to qualify as 'small' and obtain an audit exemption in the UK?", "a": "Annual turnover £10.2m or less; Gross assets £5.1m or less; Average employees 50 or fewer. At least two of the three must be met for two consecutive years.", "topic": "Audit Exemption"}, {"q": "Which entities must have a statutory audit even if they meet the small company criteria?", "a": "Insurance companies, banks, public limited companies (plcs), and companies where shareholders owning at least 10% of shares request an audit.", "topic": "Audit Requirement"}, {"q": "What is the purpose of an audit per the auditing standards?", "a": "To enhance the degree of confidence of intended users in the financial statements by providing an independent review and expressing an opinion on whether the financial statements comply with the applicable financial reporting framework.", "topic": "Audit Purpose"}, {"q": "Define 'double materiality' in the context of sustainability reporting.", "a": "Double materiality considers both (1) financial materiality — sustainability issues that may create financial risks for the company, and (2) impact materiality — sustainability issues where the company's own activities materially impact people and the environment.", "topic": "Sustainability"}, {"q": "What is the ISSB and what did it issue in June 2023?", "a": "The International Sustainability Standards Board (ISSB) was formed by the IFRS Foundation in 2021. In June 2023 it issued IFRS S1 (General Requirements for Disclosure of Sustainability-related Financial Information) and IFRS S2 (Climate-related Disclosures).", "topic": "ISSB"}, {"q": "What does IFRS S2 require companies to disclose?", "a": "Physical and transition risks and their potential impact on the move towards a low-carbon economy, and appropriate metrics and targets for climate-related reporting including the amount of greenhouse gas emissions.", "topic": "IFRS S2"}, {"q": "What are 'transition risks' in sustainability?", "a": "Transition risks are financial and reputational risks associated with moving to a lower-carbon economy, arising from extensive policy, legal, technology, and market changes.", "topic": "Sustainability"}, {"q": "What are 'chronic physical risks' in the context of climate change?", "a": "Chronic physical risks are caused by long-term shifts in climate patterns such as sustained higher temperatures, sea level rise, and changing precipitation patterns — as opposed to acute risks caused by specific extreme weather events.", "topic": "Sustainability"}, {"q": "What are OCI items that will NOT be reclassified to profit or loss?", "a": "Gains on property revaluation; gains/losses on equity investments classified as FVOCI; remeasurements of defined benefit pension plans; and the entity's share of gains/losses on revaluation of associates.", "topic": "OCI"}, {"q": "What are OCI items that MAY be reclassified subsequently to profit or loss?", "a": "Exchange differences on translating foreign operations; and cash flow hedges. These items can be 'recycled' back through profit or loss when certain conditions are met.", "topic": "OCI"}, {"q": "What is the objective of financial statements per the Conceptual Framework?", "a": "To provide information about the entity's financial position, financial performance and cash flows that is useful to a wide range of users in making economic decisions.", "topic": "Conceptual Framework"}, {"q": "Who are the primary users of financial statements?", "a": "Present and potential investors, employees, lenders, suppliers, customers, governments and their agencies, and the public.", "topic": "Conceptual Framework"}, {"q": "What does IAS 1 require to be shown separately in the statement of cash flows?", "a": "Cash flows from operating activities, investing activities, and financing activities must be presented separately. Interest paid, interest received, dividends paid and taxes paid are disclosed within the relevant category.", "topic": "IAS 1"}, {"q": "What is the Brundtland definition of sustainability?", "a": "Development that 'meets the needs of the present without compromising the ability of future generations to meet their own needs' (Brundtland Report, 1987).", "topic": "Sustainability"}, {"q": "What is the underlying assumption of financial statements per the Conceptual Framework?", "a": "Going concern — financial statements are prepared on the assumption that the entity will continue in operation for the foreseeable future.", "topic": "Conceptual Framework"}, {"q": "What governs all assurance engagements globally?", "a": "Ethics, risk assessment, terms of engagement, and International Standards on Quality Control (ISQCs). UK audits are additionally governed by the Companies Act 2006 and ISAs (UK) issued by the FRC.", "topic": "Audit Regulation"}], "Ch2: Groups – Revision and Update": [{"q": "What are the three elements of control under IFRS 10?", "a": "(1) Power over the investee — existing rights giving the current ability to direct relevant activities; (2) Exposure/rights to variable returns from involvement; (3) The ability to use power to affect the amount of those returns.", "topic": "IFRS 10 Control"}, {"q": "When is control presumed to exist under IFRS 10?", "a": "Control is presumed when the parent owns more than 50% of the voting power. However, control can exist with less than 50% if the investor has practical ability to direct relevant activities through other means.", "topic": "IFRS 10 Control"}, {"q": "Define 'significant influence' under IAS 28.", "a": "Significant influence is the power to participate in the financial and operating policy decisions of the investee, but not control or joint control. It is presumed if the investor holds 20% or more of the voting power.", "topic": "IAS 28"}, {"q": "Define 'joint control' under IFRS 11.", "a": "Joint control is the contractually agreed sharing of control of an arrangement, existing only when decisions about relevant activities require the unanimous consent of the parties sharing control.", "topic": "IFRS 11"}, {"q": "What are the four conditions for a parent to be exempt from preparing consolidated financial statements?", "a": "(1) It is a wholly/partially-owned subsidiary and other owners do not object; (2) Its instruments are not publicly traded; (3) It is not filing for public market purposes; (4) Its ultimate/intermediate parent produces IFRS-compliant consolidated statements available for public use.", "topic": "IFRS 10 Exemption"}, {"q": "How is goodwill calculated in a business combination under IFRS 3?", "a": "Goodwill = Fair value of consideration transferred + Fair value of NCI + Fair value of pre-existing equity interest – Fair value of net identifiable assets acquired. Any excess is goodwill; a deficit is a bargain purchase gain recognised immediately in P&L.", "topic": "IFRS 3 Goodwill"}, {"q": "What is the NCI (non-controlling interest) and what two methods exist for measuring it at acquisition?", "a": "NCI represents the equity interest in a subsidiary not held by the parent. It can be measured at (1) Fair value (full goodwill method) — giving NCI a share of goodwill, or (2) NCI's proportionate share of the acquiree's net identifiable assets (partial goodwill method).", "topic": "IFRS 3 NCI"}, {"q": "How are associates accounted for in consolidated financial statements under IAS 28?", "a": "Using the equity method. The investment is initially recognised at cost, then adjusted each period for the investor's share of the associate's profit or loss and OCI. Dividends received reduce the carrying amount.", "topic": "IAS 28 Equity Method"}, {"q": "What is a joint venture and how is it accounted for?", "a": "A joint venture is a joint arrangement whereby the parties have rights to the net assets. It is accounted for using the equity method under IAS 28, in the same way as an associate.", "topic": "IFRS 11"}, {"q": "What is a joint operation and how is it accounted for?", "a": "A joint operation is a joint arrangement where parties have rights to assets and obligations for liabilities. Each joint operator recognises its share of the assets, liabilities, revenues and expenses directly in its own financial statements.", "topic": "IFRS 11"}, {"q": "What is a 'step acquisition' in the context of group accounts?", "a": "A step acquisition is where a parent acquires an additional interest in an entity, taking it from associate to subsidiary. The pre-existing equity interest is remeasured to fair value at the acquisition date, with any gain/loss recognised in P&L.", "topic": "IFRS 3 Acquisitions"}, {"q": "How is a full disposal of a subsidiary accounted for?", "a": "Profit/loss on disposal = Fair value of proceeds + Fair value of any retained interest – Carrying value of net assets – Carrying value of goodwill – NCI. The profit or loss is recognised in the consolidated P&L.", "topic": "Disposals"}, {"q": "What happens when a parent loses control but retains a significant interest (subsidiary to associate)?", "a": "The subsidiary is deconsolidated. Any retained interest is remeasured to fair value at the date control is lost. A gain or loss is calculated as: Proceeds + FV of retained interest – share of net assets – goodwill – NCI. The retained interest is then equity-accounted.", "topic": "Disposals"}, {"q": "How is goodwill impairment tested and allocated in a group?", "a": "Goodwill is not amortised but tested for impairment annually (or when indicators exist) at the cash-generating unit (CGU) level. Impairment is recognised first against goodwill allocated to the CGU, then pro rata against other assets.", "topic": "IFRS 3 Goodwill"}, {"q": "What is the difference between pre-acquisition and post-acquisition profits in group accounts?", "a": "Pre-acquisition profits belong to the period before the parent gained control and are included in the fair value of the net assets at acquisition. Post-acquisition profits are the subsidiary's profits earned after the acquisition date and are included in consolidated retained earnings.", "topic": "Consolidation"}, {"q": "How are intra-group transactions eliminated in consolidated financial statements?", "a": "All intra-group balances, transactions, income and expenses are fully eliminated. Unrealised profits on intra-group inventory sales are eliminated from retained earnings and inventory. For upstream sales (sub to parent), the elimination is split between parent and NCI based on the subsidiary's ownership.", "topic": "Consolidation"}, {"q": "What is the maximum gap permitted between a subsidiary's reporting date and the group's reporting date?", "a": "Three months or less. If the subsidiary cannot prepare additional statements to the group's date, their most recent statements may be used provided adjustments are made for significant events occurring in the gap period.", "topic": "IFRS 10 Consolidation"}, {"q": "What are contingent consideration arrangements in a business combination?", "a": "Consideration whose amount depends on future events (e.g. earn-outs). Under IFRS 3, contingent consideration is recognised at fair value at the acquisition date. Subsequent changes in fair value are generally recognised in P&L (if classified as financial liability), not adjusted against goodwill.", "topic": "IFRS 3"}, {"q": "How is NCI's share of a subsidiary's profit allocated when a subsidiary has a loss?", "a": "NCI is allocated its share of losses even if this results in NCI having a negative balance (deficit). The NCI absorbs losses according to its ownership percentage unless there is a binding obligation and the NCI has the ability to make good the losses.", "topic": "IFRS 10 NCI"}, {"q": "How is the gain or loss on disposal of an associate calculated?", "a": "Gain/loss = Proceeds received – Carrying value of the associate at date of disposal. The carrying value includes the initial cost adjusted for accumulated share of profits and OCI under the equity method.", "topic": "IAS 28 Disposal"}], "Ch3: Foreign Currency Translation": [{"q": "What is 'functional currency' under IAS 21?", "a": "The currency of the primary economic environment in which an entity operates. It is determined by looking at the currency that mainly influences sales prices and costs, not necessarily where the entity is registered.", "topic": "IAS 21 Definitions"}, {"q": "What are the primary indicators for determining functional currency under IAS 21?", "a": "(1) The currency that mainly influences sales prices for goods/services; and (2) The currency that mainly influences labour, material and other costs.", "topic": "IAS 21 Functional Currency"}, {"q": "What are the secondary indicators for determining functional currency?", "a": "(1) The currency in which funds for financing activities are generated; and (2) The currency in which receipts from operating activities are retained.", "topic": "IAS 21 Functional Currency"}, {"q": "At which rate are monetary items retranslated at the reporting date under IAS 21?", "a": "Monetary items (receivables, payables, cash, loans) are retranslated at the closing rate at the reporting date. Any resulting exchange difference is recognised in profit or loss.", "topic": "IAS 21 Translation"}, {"q": "At which rate are non-monetary items translated under IAS 21?", "a": "Non-monetary items carried at historical cost are translated using the historic rate at the date of the original transaction. Non-monetary items carried at fair value use the rate at the date the fair value was determined.", "topic": "IAS 21 Translation"}, {"q": "What is the difference between the historic rate, closing rate, and average rate?", "a": "Historic rate: the spot rate at the date of the transaction. Closing rate: the exchange rate at the reporting date. Average rate: the average rate over the accounting period, used as an approximation for income and expenses if rates do not fluctuate significantly.", "topic": "IAS 21 Exchange Rates"}, {"q": "How are foreign operations translated into the presentation currency under IAS 21?", "a": "Assets and liabilities at the closing rate; income and expenses at the transaction date rate (or average if not fluctuating). The resulting exchange differences are recognised in OCI and accumulated in a separate equity reserve (translation reserve). This reserve is recycled to P&L on disposal of the operation.", "topic": "IAS 21 Foreign Operations"}, {"q": "How is goodwill on acquisition of a foreign operation translated?", "a": "Goodwill is treated as an asset of the foreign operation and is translated at the closing rate at each reporting date. Any resulting exchange difference is recognised in OCI in the translation reserve.", "topic": "IAS 21 Goodwill"}, {"q": "When is an exchange difference on a settled transaction recognised in profit or loss?", "a": "When a foreign currency transaction is settled at a rate different from the rate at which it was initially recorded, the exchange difference arising on settlement is recognised in profit or loss in the period of settlement.", "topic": "IAS 21 Settlement"}, {"q": "What does IAS 29 Financial Reporting in Hyperinflationary Economies require?", "a": "Entities operating in hyperinflationary economies must restate their financial statements using a general price index. Non-monetary items in the statement of financial position are restated; the resulting gain or loss on the net monetary position is recognised in P&L.", "topic": "IAS 29"}, {"q": "What indicators suggest an economy is hyperinflationary under IAS 29?", "a": "The population keeps wealth in non-monetary assets; prices are quoted in a stable foreign currency; credit transactions include an amount to compensate for expected loss of purchasing power; or cumulative inflation over three years approaches or exceeds 100%.", "topic": "IAS 29"}, {"q": "When translation reserve amounts are recycled, where are they recognised?", "a": "When a foreign operation is fully disposed of, the cumulative translation reserve attributable to that operation is reclassified from equity to profit or loss as part of the gain or loss on disposal.", "topic": "IAS 21 Disposal"}, {"q": "How are exchange differences on intra-group monetary items treated in consolidated financial statements?", "a": "Exchange differences on intra-group monetary items that cannot be eliminated (because one entity's functional currency differs from the group's) are recognised in OCI in the consolidated financial statements, not P&L, unless the item is a receivable or payable on which settlement is planned.", "topic": "IAS 21 Consolidated"}, {"q": "What rate is used to translate the opening equity of a foreign operation at each reporting date?", "a": "Opening equity balances are translated at the historic rates at the dates they arose (i.e., cumulative historic rates). The resulting differences between opening and closing net assets are part of the exchange difference taken to OCI.", "topic": "IAS 21 Foreign Operations"}, {"q": "What is the presentational currency under IAS 21?", "a": "The currency in which the financial statements are presented. An entity may present in any currency; if different from the functional currency, all items must be translated using the rules in IAS 21.", "topic": "IAS 21 Definitions"}], "Ch4: Financial Instruments – Recognition & Measurement": [{"q": "What are the three classification categories for financial assets under IFRS 9?", "a": "(1) Amortised cost; (2) Fair value through other comprehensive income (FVOCI); (3) Fair value through profit or loss (FVTPL). Classification depends on the entity's business model and the contractual cash flow characteristics of the instrument.", "topic": "IFRS 9 Classification"}, {"q": "What is the SPPI test under IFRS 9?", "a": "The Solely Payments of Principal and Interest (SPPI) test assesses whether contractual cash flows represent solely payments of principal and interest on the principal outstanding. A financial asset must pass the SPPI test to be eligible for amortised cost or FVOCI classification.", "topic": "IFRS 9 SPPI"}, {"q": "What are the two business model tests under IFRS 9?", "a": "(1) Hold to collect — asset held to collect contractual cash flows only → amortised cost (if SPPI passes). (2) Hold to collect and sell — asset held to collect cash flows and sell → FVOCI (if SPPI passes). Any other business model → FVTPL.", "topic": "IFRS 9 Business Model"}, {"q": "How is a financial asset at amortised cost subsequently measured?", "a": "At amortised cost using the effective interest rate (EIR) method. Interest income is recognised in P&L using the EIR applied to the gross carrying amount. Expected credit loss (ECL) provisions are also recognised.", "topic": "IFRS 9 Amortised Cost"}, {"q": "How are debt instruments classified as FVOCI treated?", "a": "They are measured at fair value. Changes in fair value go to OCI; interest income (using EIR), foreign exchange gains/losses, and ECL impairment go to P&L. On derecognition, cumulative OCI gains/losses are reclassified (recycled) to P&L.", "topic": "IFRS 9 FVOCI Debt"}, {"q": "How are equity instruments classified as FVOCI treated?", "a": "An irrevocable election at initial recognition is required. Changes in fair value go to OCI permanently — there is NO recycling to P&L on disposal. Dividends are still recognised in P&L.", "topic": "IFRS 9 FVOCI Equity"}, {"q": "What are the three stages of the IFRS 9 ECL impairment model?", "a": "Stage 1: No significant increase in credit risk since initial recognition — 12-month ECL. Stage 2: Significant increase in credit risk but not credit-impaired — lifetime ECL. Stage 3: Credit-impaired — lifetime ECL, and interest is calculated on net carrying amount.", "topic": "IFRS 9 ECL"}, {"q": "What is the '30 days past due' presumption under IFRS 9?", "a": "IFRS 9 includes a rebuttable presumption that credit risk has increased significantly if contractual payments are more than 30 days past due, requiring a move to Stage 2 (lifetime ECL).", "topic": "IFRS 9 ECL"}, {"q": "What is the '90 days past due' backstop rule under IFRS 9?", "a": "There is a rebuttable presumption that a financial asset is credit-impaired (Stage 3) when it is more than 90 days past due. This is a regulatory backstop — the presumption can be rebutted but only with reasonable and supportable evidence.", "topic": "IFRS 9 ECL"}, {"q": "How are financial liabilities classified under IFRS 9?", "a": "Most financial liabilities are measured at amortised cost. The FVTPL option is available if it eliminates or significantly reduces an accounting mismatch, or for trading liabilities. Under FVTPL for own credit risk — changes due to own credit risk go to OCI, not P&L.", "topic": "IFRS 9 Liabilities"}, {"q": "What is the effective interest rate (EIR) method?", "a": "The EIR is the rate that exactly discounts the estimated future cash payments or receipts over the life of a financial instrument to its gross carrying amount. Interest income/expense is recognised at a constant rate over the instrument's life.", "topic": "IFRS 9 EIR"}, {"q": "How is a financial asset derecognised under IFRS 9?", "a": "A financial asset is derecognised when the contractual rights to cash flows expire, or the asset is transferred and the transfer qualifies (entity transfers substantially all risks and rewards of ownership, or loses control).", "topic": "IFRS 9 Derecognition"}, {"q": "What is a financial guarantee contract and how is it accounted for?", "a": "A contract requiring the issuer to make payments to reimburse the holder for a loss incurred because a debtor fails to pay. Under IFRS 9 it is initially recognised at fair value, then subsequently at the higher of: the ECL provision or the amount initially recognised less cumulative amortisation.", "topic": "IFRS 9 Guarantees"}, {"q": "What qualifies as a derivative under IFRS 9?", "a": "A derivative has (1) a value that changes in response to an underlying variable; (2) requires no or little initial net investment; and (3) is settled at a future date. Derivatives are always classified at FVTPL unless designated in a qualifying hedge.", "topic": "IFRS 9 Derivatives"}, {"q": "What is the difference between a 'regular way purchase' and a derivative?", "a": "A regular way purchase is a contract to buy/sell a financial asset that requires delivery within a timeframe established by regulation or convention in the marketplace (e.g. T+2 for equities). It is accounted for using trade date or settlement date accounting, not as a derivative.", "topic": "IFRS 9"}, {"q": "What does 'significant increase in credit risk' (SICR) mean under IFRS 9?", "a": "SICR is assessed by comparing the risk of a default occurring over the expected life of the instrument at reporting date versus at origination. It triggers a move from 12-month ECL (Stage 1) to lifetime ECL (Stage 2). Forward-looking information must be considered.", "topic": "IFRS 9 ECL"}, {"q": "What is the simplified approach to ECL under IFRS 9?", "a": "For trade receivables, contract assets without significant financing components, and lease receivables, entities may (and for trade receivables without significant financing components, must) use a simplified approach — always measuring lifetime ECL without tracking SICR.", "topic": "IFRS 9 ECL"}, {"q": "How is interest revenue recognised on a Stage 3 (credit-impaired) asset?", "a": "On credit-impaired assets, interest revenue is calculated by applying the EIR to the NET carrying amount (i.e., the gross amount minus the ECL allowance), rather than the gross carrying amount used in Stages 1 and 2.", "topic": "IFRS 9 ECL"}, {"q": "What happens to OCI gains/losses on equity instruments designated as FVOCI when they are sold?", "a": "They are NOT recycled to profit or loss. The cumulative OCI balance may be transferred within equity (e.g. to retained earnings) but it never passes through P&L. This is the key difference from debt instruments at FVOCI.", "topic": "IFRS 9 FVOCI Equity"}, {"q": "What is a 'purchased or originated credit-impaired' (POCI) asset under IFRS 9?", "a": "A POCI asset is one that is already credit-impaired at the date of initial recognition. Only changes in lifetime ECL since initial recognition (positive or negative) are recognised in P&L. Interest is calculated using the credit-adjusted EIR on the net carrying amount.", "topic": "IFRS 9 ECL"}], "Ch5: Share-Based Payments & Distributable Profits": [{"q": "What is a share-based payment transaction under IFRS 2?", "a": "A transaction in which an entity receives goods or services as consideration for equity instruments (equity-settled), or acquires goods or services by incurring a liability based on the price of equity instruments (cash-settled).", "topic": "IFRS 2 Definitions"}, {"q": "How is an equity-settled share-based payment recognised over the vesting period?", "a": "The fair value of the equity instrument is measured at the grant date and expensed over the vesting period on a straight-line basis. The credit entry goes to a share-based payment reserve in equity. Fair value is NOT subsequently remeasured.", "topic": "IFRS 2 Equity-Settled"}, {"q": "How is a cash-settled share-based payment recognised?", "a": "A liability is recognised and measured at the fair value of the liability at each reporting date, with changes in fair value recognised in P&L. The liability is remeasured at each reporting date until settled.", "topic": "IFRS 2 Cash-Settled"}, {"q": "What are 'market conditions' and 'non-market conditions' in IFRS 2?", "a": "Market conditions are vesting conditions linked to the market price of the entity's shares (e.g. share price targets). They are reflected in the grant date fair value. Non-market conditions (e.g. EPS targets, continued employment) are NOT reflected in fair value but are used to estimate the number of awards expected to vest.", "topic": "IFRS 2 Vesting Conditions"}, {"q": "If a share option scheme has a service condition, how is the expense computed each year?", "a": "Cumulative expense = (Best estimate of number of options that will vest × grant date FV × proportion of vesting period elapsed). The P&L charge each period is the movement in cumulative expense between years.", "topic": "IFRS 2 Calculation"}, {"q": "What happens if employees fail to meet a non-market vesting condition?", "a": "If non-market vesting conditions are not met, no equity or expense is recognised for options that do not vest. Any cumulative expense already recognised is reversed in the period in which the condition is determined not to have been met.", "topic": "IFRS 2"}, {"q": "What are 'distributable profits' and why are they important?", "a": "Distributable profits are the accumulated realised profits less accumulated realised losses of a company available for dividend payment. Under the Companies Act 2006, dividends may only be paid out of distributable profits, regardless of IFRS reported profits.", "topic": "Distributable Profits"}, {"q": "Is a revaluation surplus distributable?", "a": "No. A revaluation surplus represents an unrealised gain and is not a realised profit. It is therefore not distributable. It becomes realised (and distributable) only when the underlying asset is sold.", "topic": "Distributable Profits"}, {"q": "How does the treatment of cancelled equity-settled awards differ from forfeited ones?", "a": "For cancellations (entity choice), the remaining unvested expense is accelerated and recognised immediately. For forfeitures (employee fails vesting conditions), only the expense accrued to the date of forfeiture is recognised; the rest is reversed.", "topic": "IFRS 2 Modifications"}, {"q": "How is a modification to a share-based payment scheme accounted for under IFRS 2?", "a": "If a modification increases the fair value of the award (beneficial modification), the incremental fair value is recognised as additional expense over the remaining vesting period. If the modification decreases fair value, the original grant date fair value continues to be used — you cannot reduce the expense.", "topic": "IFRS 2 Modifications"}], "Ch6: Employee Benefits": [{"q": "What is the difference between a defined contribution and a defined benefit pension plan?", "a": "In a defined contribution plan, the employer pays fixed contributions; the employee bears the investment risk. In a defined benefit plan, the employer promises a specific benefit on retirement; the employer bears the actuarial and investment risk.", "topic": "IAS 19"}, {"q": "How is the net defined benefit liability/(asset) calculated?", "a": "Net DB liability = Present value of defined benefit obligation (DBO) – Fair value of plan assets. A net asset is recognised only to the extent of the asset ceiling (the lower of the surplus and the present value of future economic benefits from refunds or reduced contributions).", "topic": "IAS 19"}, {"q": "What are the three components of defined benefit cost under IAS 19?", "a": "(1) Service cost (current service cost + past service cost + gains/losses on settlement) — recognised in P&L. (2) Net interest on net DB liability/asset — recognised in P&L. (3) Remeasurements (actuarial gains/losses + return on plan assets excl. interest) — recognised in OCI, NOT recycled.", "topic": "IAS 19"}, {"q": "What are 'remeasurements' under IAS 19 and where are they recognised?", "a": "Remeasurements comprise actuarial gains and losses on the DBO and the return on plan assets (excluding the amount included in net interest). They are recognised immediately in OCI and are never reclassified (recycled) to P&L.", "topic": "IAS 19 Remeasurements"}, {"q": "How is net interest on the net defined benefit liability calculated?", "a": "Net interest = Net DB liability (or asset) at the start of the period × the discount rate used to measure the DBO. The same rate is applied to both the DBO and the plan assets.", "topic": "IAS 19 Net Interest"}, {"q": "What is past service cost and when is it recognised?", "a": "Past service cost arises when a plan is introduced, curtailed or amended, changing the obligation for employee service in prior periods. It is recognised immediately in P&L in the period the plan amendment or curtailment occurs.", "topic": "IAS 19 Past Service"}, {"q": "What are short-term employee benefits and how are they accounted for?", "a": "Short-term employee benefits are due within 12 months of the reporting date (e.g. wages, paid annual leave, bonuses). They are recognised as an expense when the employee renders service, with an accrual for any amounts not yet paid.", "topic": "IAS 19 Short-term"}, {"q": "What discount rate is used to measure the defined benefit obligation under IAS 19?", "a": "The rate on high-quality corporate bonds (or government bonds where there is no deep market in corporate bonds) at the end of the reporting period, with a currency and term consistent with the estimated timing of benefit payments.", "topic": "IAS 19 Discount Rate"}, {"q": "What is a curtailment under IAS 19?", "a": "A curtailment is when an entity significantly reduces the number of employees covered by a plan or changes plan terms so that a significant part of future service will no longer qualify for benefits. Gains/losses on curtailment are recognised immediately in P&L as part of service cost.", "topic": "IAS 19 Curtailment"}, {"q": "What is a plan settlement under IAS 19?", "a": "A settlement is a transaction that eliminates all further legal or constructive obligations for part or all of the defined benefit plan. The resulting gain or loss is the difference between the settlement price and the carrying value of the obligation settled, recognised in P&L immediately.", "topic": "IAS 19 Settlement"}], "Ch7: Reporting of Assets and Liabilities": [{"q": "What are the criteria for recognising a provision under IAS 37?", "a": "(1) A present obligation (legal or constructive) as a result of a past event; (2) It is probable (more likely than not) that an outflow of economic resources will be required; (3) A reliable estimate can be made of the amount.", "topic": "IAS 37 Provisions"}, {"q": "What is a contingent liability under IAS 37 and how is it treated?", "a": "A contingent liability is a possible obligation dependent on uncertain future events, or a present obligation where outflow is not probable or cannot be measured reliably. It is NOT recognised but disclosed in the notes, unless the probability is remote.", "topic": "IAS 37 Contingencies"}, {"q": "How is a provision measured under IAS 37?", "a": "At the best estimate of the expenditure required to settle the obligation at the reporting date. For a large population of items, the expected value (probability-weighted average) is used. For a single obligation, the most likely outcome is used, adjusted for other possible outcomes.", "topic": "IAS 37 Measurement"}, {"q": "When should a provision be discounted under IAS 37?", "a": "When the time value of money is material — i.e., when the provision is expected to be settled in the long-term future. The discount rate must be a pre-tax rate reflecting current market assessments of the time value of money and risks specific to the liability.", "topic": "IAS 37 Discounting"}, {"q": "What are the criteria for recognising an intangible asset under IAS 38?", "a": "An intangible asset must be identifiable (separable or arising from contractual/legal rights), controlled by the entity, and it is probable that future economic benefits will flow to the entity, with a reliably measurable cost.", "topic": "IAS 38"}, {"q": "What is the accounting treatment for research and development costs under IAS 38?", "a": "Research costs are always expensed as incurred. Development costs are capitalised only when all six criteria are met: technical feasibility; intention to complete; ability to use/sell; probable future economic benefits; adequate resources; and ability to reliably measure expenditure.", "topic": "IAS 38 R&D"}, {"q": "How is an investment property defined under IAS 40?", "a": "Property held to earn rental income or for capital appreciation (or both), rather than for use in production/supply of goods/services or for sale in the ordinary course of business.", "topic": "IAS 40"}, {"q": "What are the two measurement models for investment property under IAS 40?", "a": "(1) Fair value model — carried at fair value with gains/losses recognised in P&L; no depreciation. (2) Cost model — carried at cost less accumulated depreciation and impairment (same as IAS 16 PPE). The chosen model must be applied consistently to all investment property.", "topic": "IAS 40"}, {"q": "Under IAS 36, what is the recoverable amount of an asset?", "a": "Recoverable amount = the higher of (1) Fair value less costs of disposal (FVLCD), and (2) Value in use (VIU). An asset is impaired when its carrying amount exceeds its recoverable amount.", "topic": "IAS 36"}, {"q": "What is value in use under IAS 36?", "a": "The present value of the future cash flows expected to be derived from an asset or CGU, discounted at a pre-tax rate that reflects current market assessments of the time value of money and the risks specific to the asset.", "topic": "IAS 36 VIU"}, {"q": "How is an impairment loss reversed under IAS 36?", "a": "Reversal is permitted if the recoverable amount subsequently exceeds the carrying amount. The reversal is limited so that the carrying amount does not exceed what it would have been (net of depreciation) had no impairment been recognised. Goodwill impairment is NEVER reversed.", "topic": "IAS 36 Reversal"}, {"q": "What is a 'constructive obligation' under IAS 37?", "a": "An obligation arising from an entity's actions — where an established pattern of past practice, published policies or a sufficiently specific statement has created a valid expectation in other parties that the entity will discharge the obligation.", "topic": "IAS 37"}], "Ch8: Industry Specific Standards": [{"q": "What is an agricultural asset under IAS 41 Agriculture?", "a": "A biological asset (a living animal or plant) or agricultural produce (the harvested product of a biological asset). Examples: livestock, fruit trees, harvested crops.", "topic": "IAS 41"}, {"q": "How are biological assets measured under IAS 41?", "a": "Biological assets are measured at fair value less costs to sell at each reporting date, unless fair value cannot be reliably measured (rare). Gains or losses from changes in fair value less costs to sell are recognised in P&L.", "topic": "IAS 41"}, {"q": "How is agricultural produce recognised and measured under IAS 41?", "a": "Agricultural produce is recognised at the point of harvest and measured at fair value less costs to sell at that point. After harvest, IAS 2 Inventories applies.", "topic": "IAS 41"}, {"q": "What is an exploration and evaluation asset under IFRS 6?", "a": "Expenditure related to the search for mineral resources, including minerals, oil, natural gas and similar non-regenerative resources after the entity has obtained legal rights to explore in a specific area, and before technical feasibility and commercial viability are established.", "topic": "IFRS 6"}, {"q": "How are exploration and evaluation assets measured under IFRS 6?", "a": "Initially at cost. Subsequently, an entity may use the cost model or the revaluation model. They must also be assessed for impairment when facts suggest the carrying amount may exceed the recoverable amount.", "topic": "IFRS 6"}, {"q": "What are the indicators triggering an impairment review of E&E assets under IFRS 6?", "a": "The exploration rights have expired or are near expiry with no renewal expected; no further exploration/evaluation is budgeted; the E&E asset has not led to commercially viable mineral deposits; or data indicates the carrying amount will not be recovered.", "topic": "IFRS 6"}, {"q": "What is a 'bearer plant' under IAS 16 and IAS 41?", "a": "A living plant used in the production or supply of agricultural produce, expected to bear produce for more than one period, and with a remote likelihood of being sold as agricultural produce. Bearer plants (e.g. grape vines) are accounted for under IAS 16 (PPE), not IAS 41.", "topic": "IAS 41"}, {"q": "Under IFRS 14 Regulatory Deferral Accounts, what is a regulatory deferral account balance?", "a": "An amount of income or expense that would not be recognised under other IFRS standards, but is deferred because it is included in the rate regulation process of a rate-regulated activity (e.g. utility companies). These are presented separately in the financial statements.", "topic": "IFRS 14"}], "Ch9: Revenue": [{"q": "What is the five-step model for revenue recognition under IFRS 15?", "a": "Step 1: Identify the contract(s) with a customer. Step 2: Identify the performance obligations. Step 3: Determine the transaction price. Step 4: Allocate the transaction price to performance obligations. Step 5: Recognise revenue when (or as) a performance obligation is satisfied.", "topic": "IFRS 15 Five Steps"}, {"q": "What is a 'performance obligation' under IFRS 15?", "a": "A promise to transfer a distinct good or service (or bundle) to a customer. A good or service is distinct if the customer can benefit from it on its own or together with other readily available resources, AND it is separately identifiable from other promises in the contract.", "topic": "IFRS 15"}, {"q": "What are the criteria for a contract to exist under IFRS 15 Step 1?", "a": "The parties have approved the contract; each party's rights regarding the goods/services are identifiable; payment terms are identifiable; the contract has commercial substance; and it is probable the entity will collect the consideration to which it is entitled.", "topic": "IFRS 15 Step 1"}, {"q": "When is revenue recognised 'over time' vs 'at a point in time' under IFRS 15?", "a": "Revenue is recognised over time if: (1) customer simultaneously receives and consumes benefits; (2) the entity's performance creates/enhances an asset the customer controls; or (3) the entity's performance creates an asset with no alternative use and the entity has an enforceable right to payment for performance completed. Otherwise, at a point in time.", "topic": "IFRS 15 Step 5"}, {"q": "How is the transaction price determined when variable consideration exists?", "a": "Variable consideration (e.g. discounts, rebates, refunds, performance bonuses) is estimated using the expected value method (probability-weighted) or the most likely amount method, subject to the constraint that revenue is only included to the extent a significant reversal is not highly probable.", "topic": "IFRS 15 Step 3"}, {"q": "How is the transaction price allocated to performance obligations in a bundle?", "a": "The transaction price is allocated based on the relative standalone selling prices (SSPs) of each performance obligation. If SSPs are not directly observable, they must be estimated (using adjusted market assessment, expected cost plus margin, or residual approaches).", "topic": "IFRS 15 Step 4"}, {"q": "What is the accounting treatment for a significant financing component in a contract?", "a": "If a contract contains a significant financing component (payment received well in advance or in arrears), the transaction price is adjusted to reflect the cash selling price. Interest income/expense is recognised separately using the effective interest method.", "topic": "IFRS 15 Financing"}, {"q": "How should contract costs (e.g. sales commissions) be treated under IFRS 15?", "a": "Incremental costs of obtaining a contract (e.g. sales commissions) are capitalised as a contract cost asset if they are expected to be recovered, and amortised on a basis consistent with the transfer of goods/services. An entity may expense if the amortisation period would be one year or less.", "topic": "IFRS 15 Costs"}, {"q": "What is a 'contract modification' under IFRS 15 and how is it treated?", "a": "A change in the scope or price of a contract. If the modification adds distinct goods/services at their standalone price, it is treated as a separate contract. If not, it is accounted for prospectively (if remaining goods/services are distinct) or as a cumulative catch-up adjustment.", "topic": "IFRS 15 Modifications"}, {"q": "How are warranties accounted for under IFRS 15?", "a": "Assurance warranties (guaranteeing the product works as specified) are accounted for under IAS 37 (provision). Service warranties (providing additional service beyond assurance) are treated as a separate performance obligation under IFRS 15 and a portion of the transaction price is allocated to them.", "topic": "IFRS 15 Warranties"}, {"q": "What is a principal vs agent distinction under IFRS 15?", "a": "A principal controls the good/service before transferring to the customer and recognises revenue gross. An agent arranges for another party to provide the good/service and recognises only the fee/commission as revenue (net presentation).", "topic": "IFRS 15 Principal/Agent"}, {"q": "What are 'contract assets' and 'contract liabilities' under IFRS 15?", "a": "A contract asset is an entity's right to consideration in exchange for goods/services already transferred but not yet unconditionally owed. A contract liability is the entity's obligation to transfer goods/services for which consideration has already been received (deferred revenue).", "topic": "IFRS 15 B/S"}], "Ch10: Leases": [{"q": "How does a lessee recognise a lease at commencement under IFRS 16?", "a": "The lessee recognises a right-of-use (ROU) asset and a corresponding lease liability. The lease liability is the present value of future lease payments discounted at the interest rate implicit in the lease (or the lessee's incremental borrowing rate if that cannot be determined).", "topic": "IFRS 16 Lessee"}, {"q": "What is included in the measurement of the lease liability under IFRS 16?", "a": "Fixed lease payments (less incentives receivable); variable lease payments that depend on an index or rate; the exercise price of a purchase option (if reasonably certain to be exercised); lease payments after an optional extension period (if reasonably certain to extend); and penalties for early termination (if termination is assumed).", "topic": "IFRS 16 Lease Liability"}, {"q": "How is the right-of-use asset initially measured under IFRS 16?", "a": "Initial lease liability + initial direct costs + prepaid lease payments – lease incentives received + estimated cost of dismantling/restoring. Subsequently, the ROU asset is depreciated over the shorter of the lease term or useful life of the underlying asset.", "topic": "IFRS 16 ROU Asset"}, {"q": "What are the two exemptions from IFRS 16 lessee recognition?", "a": "(1) Short-term leases — lease term of 12 months or less at commencement. (2) Low-value asset leases (e.g. laptops, phones). Both are expensed on a straight-line basis over the lease term, with no ROU asset/liability recognised.", "topic": "IFRS 16 Exemptions"}, {"q": "How does a lessor classify leases under IFRS 16?", "a": "As a finance lease (if substantially all risks and rewards of ownership are transferred to the lessee) or an operating lease (all others). The classification is made at the inception of the lease.", "topic": "IFRS 16 Lessor"}, {"q": "How does a lessor account for a finance lease?", "a": "The lessor derecognises the underlying asset and recognises a net investment in the lease (equal to the present value of lease payments). Finance income is recognised over the lease term using the effective interest method on the net investment.", "topic": "IFRS 16 Finance Lease Lessor"}, {"q": "How does a lessor account for an operating lease?", "a": "The underlying asset remains on the lessor's balance sheet and is depreciated. Lease income is recognised on a straight-line basis over the lease term (or another systematic basis if more representative of the pattern of benefit).", "topic": "IFRS 16 Operating Lease Lessor"}, {"q": "What are the indicators of a finance lease under IFRS 16?", "a": "Ownership transfers at end; bargain purchase option; lease term is major part of asset's economic life; PV of payments amounts to substantially all of fair value; specialised nature (only lessee can use without major modification); lessee bears lessor's losses from cancellation; residual risk lies with lessee.", "topic": "IFRS 16 Classification"}, {"q": "How is a sale and leaseback transaction accounted for under IFRS 16 (when it qualifies as a sale)?", "a": "The seller-lessee derecognises the asset and recognises a gain/loss only to the extent it relates to the rights transferred to the buyer-lessor (i.e. the gain is restricted by the proportion of the asset sold). A ROU asset and lease liability are recognised.", "topic": "IFRS 16 Sale & Leaseback"}, {"q": "How is a sale and leaseback treated when the transaction does NOT qualify as a sale under IFRS 15?", "a": "The asset is not derecognised. The seller-lessee continues to recognise the asset and recognises a financial liability equal to the proceeds received. The buyer-lessor recognises a financial asset.", "topic": "IFRS 16 Sale & Leaseback"}, {"q": "What lease payments are used to measure the net investment in a finance lease (lessor)?", "a": "Fixed payments (net of lease incentives); variable payments based on an index/rate; unguaranteed residual values; exercise price of purchase options the lessee is reasonably certain to exercise; and penalties for early termination the lessee is assumed to pay.", "topic": "IFRS 16 Lessor"}, {"q": "How are variable lease payments that do NOT depend on an index or rate treated by the lessee?", "a": "They are NOT included in the lease liability. They are recognised as an expense in P&L in the period in which the condition that triggers the payment is met.", "topic": "IFRS 16 Variable Payments"}], "Ch11: Earnings Per Share": [{"q": "What is the formula for basic EPS under IAS 33?", "a": "Basic EPS = Profit or loss attributable to ordinary equity holders ÷ Weighted average number of ordinary shares outstanding during the period.", "topic": "IAS 33 Basic EPS"}, {"q": "How is the weighted average number of shares calculated for a bonus issue during the year?", "a": "A bonus issue (capitalisation issue) is treated as if it occurred at the beginning of the earliest period presented. The bonus fraction is applied retrospectively to all prior periods. No time-weighting is needed for the bonus element itself.", "topic": "IAS 33 Bonus Issue"}, {"q": "How is a rights issue treated for EPS purposes?", "a": "A rights issue at below-market price contains a bonus element. The theoretical ex-rights price (TERP) is calculated. A bonus fraction (pre-rights price / TERP) is applied to shares before the rights issue. Shares issued for full consideration are weighted from the date of issue.", "topic": "IAS 33 Rights Issue"}, {"q": "What is diluted EPS and why is it calculated?", "a": "Diluted EPS shows the worst-case impact on EPS if all dilutive potential ordinary shares (options, convertibles) were converted/exercised. It warns investors of potential earnings dilution. Formula: (Adjusted earnings) ÷ (Weighted average shares + dilutive potential shares).", "topic": "IAS 33 Diluted EPS"}, {"q": "How are share options included in the diluted EPS calculation?", "a": "Using the treasury share method: proceeds from exercising options (number of options × exercise price) are assumed to buy shares at average market price. Net new shares = options outstanding – shares buyable with proceeds. These net shares are added to the denominator.", "topic": "IAS 33 Options"}, {"q": "How is convertible debt included in the diluted EPS calculation?", "a": "The numerator is increased by the after-tax interest saving on the convertible debt. The denominator is increased by the number of shares that would be issued on conversion. Convertible debt is dilutive only if the per-share earnings impact is less than basic EPS.", "topic": "IAS 33 Convertibles"}, {"q": "Which entities are required to present EPS under IAS 33?", "a": "Entities whose ordinary shares or potential ordinary shares are publicly traded, and entities in the process of issuing ordinary shares in public markets. EPS must also be presented in consolidated financial statements.", "topic": "IAS 33 Scope"}, {"q": "What is a contingently issuable share under IAS 33?", "a": "Shares issuable for little or no cash consideration when certain conditions are met (e.g. profit targets). They are included in diluted EPS from the beginning of the period if the conditions would have been met at the reporting date. They are included in basic EPS only from the date all conditions are met.", "topic": "IAS 33 Contingent"}], "Ch12: Financial Instruments – Hedge Accounting": [{"q": "What are the three types of hedging relationships under IFRS 9?", "a": "(1) Fair value hedge: hedging exposure to changes in fair value of a recognised asset/liability or firm commitment. (2) Cash flow hedge: hedging variability in cash flows attributable to a risk in a recognised asset/liability or highly probable forecast transaction. (3) Net investment hedge: hedging the currency risk of a net investment in a foreign operation.", "topic": "IFRS 9 Hedge Types"}, {"q": "What are the qualifying criteria for a hedging relationship under IFRS 9?", "a": "(1) Formal designation and documentation at inception; (2) The hedging relationship meets hedge effectiveness requirements; (3) The hedged item is an eligible hedged item; (4) The hedging instrument is an eligible hedging instrument.", "topic": "IFRS 9 Hedge Criteria"}, {"q": "What effectiveness requirement must a hedging relationship meet under IFRS 9?", "a": "There must be an economic relationship between the hedged item and hedging instrument; the effect of credit risk should not dominate value changes; and the hedge ratio must reflect the actual quantities used for risk management. Quantitative effectiveness testing is not prescribed — there is no 80-125% bright line.", "topic": "IFRS 9 Effectiveness"}, {"q": "How is a fair value hedge accounted for under IFRS 9?", "a": "The gain or loss on the hedging instrument is recognised in P&L. The carrying amount of the hedged item is adjusted for the hedging gain or loss (hedge adjustment) and that gain/loss is also recognised in P&L. The two offset in P&L, leaving only ineffectiveness.", "topic": "IFRS 9 Fair Value Hedge"}, {"q": "How is a cash flow hedge accounted for under IFRS 9?", "a": "The effective portion of the hedging instrument's gain/loss is recognised in OCI (cash flow hedge reserve). The ineffective portion goes to P&L. The OCI amount is reclassified to P&L when the hedged item affects P&L, or is included in the cost of a non-financial asset/liability (basis adjustment).", "topic": "IFRS 9 Cash Flow Hedge"}, {"q": "What is a 'basis adjustment' in a cash flow hedge?", "a": "When the hedged item is a forecast transaction that results in recognition of a non-financial asset or liability, the entity may reclassify the cash flow hedge reserve directly into the initial cost (basis) of the asset/liability rather than through P&L.", "topic": "IFRS 9 Basis Adjustment"}, {"q": "How is a net investment hedge accounted for?", "a": "The effective portion of the hedging instrument gain/loss is recognised in OCI (in the translation reserve). The ineffective portion goes to P&L. The OCI amount is reclassified to P&L on disposal of the foreign operation.", "topic": "IFRS 9 Net Investment Hedge"}, {"q": "What is the 'lower of' test in a cash flow hedge?", "a": "The amount recognised in OCI is limited to the lower of: (1) the cumulative gain/loss on the hedging instrument since inception, and (2) the cumulative change in fair value of the hedged item since inception. Any excess is recognised in P&L as ineffectiveness.", "topic": "IFRS 9 Cash Flow Hedge"}, {"q": "What happens when a hedging relationship is discontinued under IFRS 9?", "a": "For cash flow hedges, the cumulative amount in OCI remains in equity until the forecast transaction occurs (affecting P&L) or is no longer expected to occur (when the OCI amount is reclassified to P&L immediately). The hedging instrument continues to be measured at FVTPL.", "topic": "IFRS 9 Discontinuation"}, {"q": "What instruments can qualify as hedging instruments under IFRS 9?", "a": "Derivatives measured at FVTPL (interest rate swaps, forward contracts, options) and, for foreign currency risk only, non-derivative financial assets or liabilities measured at FVTPL or amortised cost. An entity's own equity instruments cannot be hedging instruments.", "topic": "IFRS 9 Hedging Instruments"}, {"q": "What can qualify as a hedged item under IFRS 9?", "a": "Recognised assets/liabilities; unrecognised firm commitments; highly probable forecast transactions; net investments in foreign operations. The hedged item must expose the entity to risk that could affect P&L. A component of an item can be designated as the hedged item.", "topic": "IFRS 9 Hedged Item"}], "Ch13: Income Taxes": [{"q": "What is the difference between current tax and deferred tax?", "a": "Current tax is the tax payable/recoverable in respect of the taxable profit/loss for the current period. Deferred tax represents the future tax consequences of temporary differences between the carrying amount of assets/liabilities and their tax bases.", "topic": "IAS 12 Overview"}, {"q": "What is a temporary difference under IAS 12?", "a": "The difference between the carrying amount of an asset or liability in the statement of financial position and its tax base. A taxable temporary difference leads to a deferred tax liability; a deductible temporary difference leads to a deferred tax asset.", "topic": "IAS 12 Temp Differences"}, {"q": "What is the 'tax base' of an asset?", "a": "The amount that will be deductible for tax purposes against any taxable economic benefits when the asset is recovered. If those benefits will not be taxable, the tax base equals the carrying amount.", "topic": "IAS 12 Tax Base"}, {"q": "What is the 'tax base' of a liability?", "a": "The carrying amount of the liability less any amount that will be deductible for tax purposes in future periods. For deferred revenue (income received in advance), the tax base is the carrying amount less any amount of the revenue that will not be taxed in future.", "topic": "IAS 12 Tax Base"}, {"q": "When is a deferred tax asset recognised under IAS 12?", "a": "A DTA is recognised for deductible temporary differences, unused tax losses, and unused tax credits to the extent it is probable that future taxable profits will be available against which they can be utilised.", "topic": "IAS 12 DTA"}, {"q": "When is a deferred tax liability NOT recognised under IAS 12?", "a": "A DTL is not recognised for: (1) the initial recognition of goodwill; (2) an asset or liability from a transaction that is not a business combination and affects neither accounting profit nor taxable profit at the time of transaction.", "topic": "IAS 12 DTL Exceptions"}, {"q": "What tax rate is used to measure deferred tax?", "a": "The tax rates expected to apply in the period when the asset is realised or the liability is settled, based on tax rates that have been enacted or substantively enacted by the reporting date.", "topic": "IAS 12 Tax Rate"}, {"q": "Where is the deferred tax charge/credit recognised?", "a": "Deferred tax is recognised in P&L unless it relates to items recognised in OCI (in which case the deferred tax is also in OCI) or items recognised directly in equity (deferred tax goes to equity). This is the 'follow the transaction' principle.", "topic": "IAS 12 Recognition"}, {"q": "How does deferred tax arise on a revaluation of PPE?", "a": "When PPE is revalued upwards, the carrying amount exceeds the tax base, creating a taxable temporary difference and a DTL. The DTL is recognised in OCI (matching the revaluation surplus), not in P&L.", "topic": "IAS 12 Revaluation"}, {"q": "How is deferred tax treated in a business combination under IFRS 3?", "a": "Acquired assets and liabilities are recognised at fair value, which may differ from their tax bases, creating temporary differences. DTLs/DTAs are recognised (except for goodwill DTL and the initial recognition exception). Recognised DTAs affect the goodwill calculation.", "topic": "IAS 12 Business Combinations"}, {"q": "Can deferred tax assets and liabilities be offset?", "a": "Yes, but only when: (1) there is a legally enforceable right to offset current tax assets against current tax liabilities; AND (2) the deferred taxes relate to income taxes levied by the same taxation authority on the same taxable entity.", "topic": "IAS 12 Offset"}, {"q": "What are the IAS 12 disclosure requirements for income taxes?", "a": "Key disclosures include: current tax expense; deferred tax movements; reconciliation of effective tax rate to the statutory rate; amounts and expiry dates of unrecognised deferred tax assets for losses; and the deferred tax rate used.", "topic": "IAS 12 Disclosures"}], "Ch14: Corporate Governance": [{"q": "What is corporate governance?", "a": "The means by which a company is operated and controlled. It addresses the separation of ownership (shareholders) and management, aiming to ensure companies are run in shareholders' and stakeholders' best interests.", "topic": "Governance Overview"}, {"q": "What are the key features of the UK Corporate Governance Code's approach?", "a": "The Code operates on a 'comply or explain' basis for premium-listed companies: companies must comply with the principles or explain why they have not. It covers board leadership, division of responsibilities, composition, audit, risk and remuneration.", "topic": "UK CG Code"}, {"q": "What is the recommended board structure under the UK Corporate Governance Code?", "a": "The Code recommends a separation of roles — a Non-Executive Chairman (responsible for board effectiveness) and a separate CEO (responsible for day-to-day management). At least half of the board (excluding the chair) should be independent NEDs.", "topic": "UK CG Code Board"}, {"q": "What are the features of poor corporate governance?", "a": "Domination by a single individual; lack of board involvement; poor internal control; lack of independent scrutiny; lack of contact with shareholders; short-term focus; lack of transparency.", "topic": "Poor Governance"}, {"q": "What are the main requirements of the Sarbanes-Oxley Act 2002?", "a": "US legislation requiring CEO and CFO personal certification of financial statements; independence of the audit committee (all members must be independent directors); mandatory rotation of audit partners; prohibition of certain non-audit services; whistleblower protections.", "topic": "Sarbanes-Oxley"}, {"q": "What is the role of the audit committee under the UK Corporate Governance Code?", "a": "The audit committee (at least three independent NEDs, at least one with relevant financial experience) monitors the integrity of financial reporting; oversees external auditors (independence, appointment, fees); reviews internal audit; and reviews risk management.", "topic": "Audit Committee"}, {"q": "What is the principal-agent problem in corporate governance?", "a": "Shareholders (principals) delegate management to directors (agents). Agents may act in their own self-interest rather than in shareholders' interests. Corporate governance mechanisms (NEDs, audit committees, shareholder rights) are designed to manage this conflict.", "topic": "Agency Theory"}, {"q": "What is the recommended approach to director remuneration under the UK CG Code?", "a": "Remuneration should be designed to promote long-term sustainable success. The remuneration committee (independent NEDs) sets executive pay. Significant portions should be performance-linked and subject to clawback. There should be no reward for failure.", "topic": "Remuneration"}], "Ch15: The Statutory Audit Process": [{"q": "What are the components of audit risk?", "a": "Audit risk = Inherent risk × Control risk × Detection risk. Inherent risk is the susceptibility of an assertion to misstatement before controls. Control risk is the risk controls fail to prevent/detect misstatement. Detection risk is the risk audit procedures fail to detect existing misstatements.", "topic": "Audit Risk"}, {"q": "What is the auditor's responsibility regarding fraud under ISA 240?", "a": "The auditor is responsible for obtaining reasonable assurance that the financial statements are free from material misstatement, whether caused by fraud
